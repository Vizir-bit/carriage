name: Carriage — resume a build from another run

on:
  workflow_dispatch:
    inputs:
      from_run_id:
        description: Run whose last checkpoint (github_build_artifact_arm64) to continue from
        required: true

permissions:
  contents: read
  actions: read

jobs:
  build_job_01:
    uses: ./.github/workflows/build-phase.yml
    secrets: inherit
    with:
      arch: arm64
      os: macos-latest
      resume: true
      from_run_id: ${{ inputs.from_run_id }}

  build_job_02:
    needs: build_job_01
    if: ${{needs.build_job_01.outputs.status == 'running'}}
    uses: ./.github/workflows/build-phase.yml
    secrets: inherit
    with:
      arch: arm64
      os: macos-latest
      resume: true

  build_job_03:
    needs: build_job_02
    if: ${{needs.build_job_02.outputs.status == 'running'}}
    uses: ./.github/workflows/build-phase.yml
    secrets: inherit
    with:
      arch: arm64
      os: macos-latest
      resume: true

  build_job_04:
    needs: build_job_03
    if: ${{needs.build_job_03.outputs.status == 'running'}}
    uses: ./.github/workflows/build-phase.yml
    secrets: inherit
    with:
      arch: arm64
      os: macos-latest
      resume: true

  build_job_05:
    needs: build_job_04
    if: ${{needs.build_job_04.outputs.status == 'running'}}
    uses: ./.github/workflows/build-phase.yml
    secrets: inherit
    with:
      arch: arm64
      os: macos-latest
      resume: true

  build_job_06:
    needs: build_job_05
    if: ${{needs.build_job_05.outputs.status == 'running'}}
    uses: ./.github/workflows/build-phase.yml
    secrets: inherit
    with:
      arch: arm64
      os: macos-latest
      resume: true

  build_job_07:
    needs: build_job_06
    if: ${{needs.build_job_06.outputs.status == 'running'}}
    uses: ./.github/workflows/build-phase.yml
    secrets: inherit
    with:
      arch: arm64
      os: macos-latest
      resume: true

  build_job_08:
    needs: build_job_07
    if: ${{needs.build_job_07.outputs.status == 'running'}}
    uses: ./.github/workflows/build-phase.yml
    secrets: inherit
    with:
      arch: arm64
      os: macos-latest
      resume: true

  build_job_09:
