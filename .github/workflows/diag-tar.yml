name: Carriage — diag tar mtimes
on: workflow_dispatch
jobs:
  t:
    runs-on: macos-latest
    steps:
      - run: |
          set -x
          tar --version
          mkdir -p w/src && echo x > w/src/f && sleep 0.3 && echo y > w/src/g
          stat -f '%N %Fm' w/src/f w/src/g
          for fmt in default pax; do
            rm -rf o && mkdir o
            if [ $fmt = default ]; then tar -C w -c -f - src | zstd -q -o a.tar.zst -f; else tar --format pax -C w -c -f - src | zstd -q -o a.tar.zst -f; fi
            tar -C o -xf a.tar.zst
            echo "== $fmt"; stat -f '%N %Fm' o/src/f o/src/g
          done
