name: Orient-Express — patch new-tab clocks in a released build

on:
  workflow_dispatch:
    inputs:
      source_tag: {description: Release to patch, required: true, default: v0.19.2.1-orient-express.1}
      tag: {description: New release tag, required: true, default: v0.19.2.1-orient-express.2}
      publish: {description: Publish a release, required: true, default: 'true'}

permissions:
  contents: write

jobs:
  patch:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Patch, sign, test, package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail
          pip3 install --break-system-packages -q brotli || pip3 install -q brotli
          gh release download "${{ inputs.source_tag }}" --repo "${{ github.repository }}" --pattern '*.dmg' --dir dl
          mnt=$(mktemp -d); hdiutil attach -nobrowse -readonly -mountpoint "$mnt" dl/*.dmg
          mkdir -p out; ditto "$mnt/Orient-Express.app" out/Orient-Express.app; hdiutil detach "$mnt"
          app=out/Orient-Express.app
          # Find the pak holding the clock zones and show the context
          python3 - "$app" <<'PY'
          import sys, glob, re
          sys.path.insert(0, 'scripts'); import pak_patch as p
          for f in glob.glob(sys.argv[1] + '/**/*.pak', recursive=True):
              enc, order, res, al = p.read(f)
              for rid in order:
                  k, raw = p.decode(res[rid])
                  for m in re.finditer(rb'Europe/Moscow|carriageClocks\s*\{', raw):
                      print(f, rid, k, raw[max(0, m.start()-200):m.end()+160])
          PY
          pak="$app/Contents/Frameworks/Carriage Framework.framework/Versions/155.0.8059.39/Resources/resources.pak"
          python3 scripts/pak_patch.py "$pak" 'CARRIAGE_CLOCK_ZONES' \
            '["Paris","Europe/Paris"],=>["Paris","Europe/Paris"],["Roma","Europe/Rome"],' \
            '#carriageClocks{display:flex;gap:64px;=>#carriageClocks{display:flex;gap:clamp(20px,3.2vw,64px);'
          # Verify Roma is present
          python3 - "$app" <<'PY'
          import sys, glob
          sys.path.insert(0, 'scripts'); import pak_patch as p
          ok = False
          for f in glob.glob(sys.argv[1] + '/**/*.pak', recursive=True):
              enc, order, res, al = p.read(f)
              for rid in order:
                  raw = p.decode(res[rid])[1]
                  if b'["Roma","Europe/Rome"]' in raw and b'gap:clamp(20px,3.2vw,64px)' in raw: ok = True; print('Roma OK in', f, rid)
          sys.exit(0 if ok else 'Roma not inserted')
          PY
          xattr -cr "$app"
          codesign --force --deep --sign - "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          # Render the new tab page and screenshot it
          "$app/Contents/MacOS/Carriage" --headless=new --no-first-run --user-data-dir="$RUNNER_TEMP/p" \
             --window-size=1440,900 --screenshot="$PWD/ntp-1440.png" chrome://new-tab-page/ || true
          "$app/Contents/MacOS/Carriage" --headless=new --no-first-run --user-data-dir="$RUNNER_TEMP/p" \
             --window-size=1024,768 --screenshot="$PWD/ntp-1024.png" chrome://new-tab-page/ || true
          ls -la *.png || true
          ln -s /Applications out/Applications
          dmg=orient-express_0.19.2.1-2_arm64-macos.dmg
          hdiutil create -volname Orient-Express -srcfolder out -ov -format UDZO "$dmg"
          sha=$(shasum -a 256 "$dmg" | cut -d' ' -f1); echo "$sha  $dmg" > "$dmg.sha256"
          echo "DMG=$dmg" >> $GITHUB_ENV; echo "SHA=$sha" >> $GITHUB_ENV
      - uses: actions/upload-artifact@v4
        with: {name: screenshots, path: '*.png', if-no-files-found: warn}
      - name: Publish
        if: inputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s\n' "Orient-Express, second test build: a fourth clock, Roma, joins London, Paris and Moscow in the Pullman windows, and the spacing between windows now adapts to the window width." "" "Same browser otherwise (Helium 0.19.2.1 / Chromium 155). Not signed by Apple: the first time, right-click Orient-Express in Applications and choose Open." "" "sha256: $SHA" > notes.md
          gh release create "${{ inputs.tag }}" "$DMG" "$DMG.sha256" --repo "${{ github.repository }}" --prerelease \
            --title "Orient-Express — four clocks with Roma (Apple Silicon)" --notes-file notes.md
