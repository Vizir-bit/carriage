name: Carriage — universal app (Apple silicon and Intel)

# Joins the arm64 and x86_64 disk images of a build into a single universal
# Carriage.app and disk image. Called at the end of build.yml; can also be run
# by hand on a finished build run, or on two runs of the same source (an arm64
# run and a separate Intel run, such as a resumed or companion build).

on:
  workflow_call:
    inputs:
      run_id: {required: true, type: string}
      x86_64_run_id: {required: false, type: string, default: ''}
      same_source_confirmed: {required: false, type: boolean, default: false}
      companion_workflows: {required: false, type: string, default: intel-companion.yml}
      take_arm64: {required: false, type: string, default: ''}
    outputs:
      file_name:
        value: ${{ jobs.universal.outputs.file_name }}
  # A push of this file to this branch only registers the workflow, so that it
  # can be run by hand from the branch before it reaches main; the job itself
  # is skipped for pushes.
  push:
    branches: [essex/codex-improvements-debug-eecb34]
    paths: [.github/workflows/universal.yml]
  workflow_dispatch:
    inputs:
      run_id:
        description: Build run holding the arm64 disk image (carriage_*_arm64-macos.dmg), and the x86_64 one unless given below
        required: true
      x86_64_run_id:
        description: 'Only if the x86_64 disk image comes from another run (for example a resumed build): that run'
        required: false
        default: ''
      same_source_confirmed:
        description: 'Only if the check refuses two runs whose commits differ in more than an added workflow: I have checked that both builds come from the same Carriage source'
        type: boolean
        required: false
        default: false
      companion_workflows:
        description: 'Workflow files (names in .github/workflows, separated by spaces) that one run may add without counting as a different source; each was reviewed to only start the shared build'
        required: false
        default: intel-companion.yml
      take_arm64:
        description: 'Only if a merge stopped on a data file that may safely come from the arm64 build: its path pattern(s), separated by spaces'
        required: false
        default: ''

permissions:
  contents: read
  actions: read

jobs:
  universal:
    name: Merge into a universal app
    runs-on: macos-latest
    # Skip the registration push only: a run started by a caller that was
    # itself triggered by a push still has run_id, and runs.
    if: ${{ github.event_name != 'push' || inputs.run_id != '' }}
    outputs:
      file_name: ${{ steps.merge.outputs.file_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check that both builds have finished
        # Skipped when build.yml calls this at the end of its own run.
        if: ${{ inputs.run_id != github.run_id }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARM_RUN: ${{ inputs.run_id }}
          X86_RUN: ${{ inputs.x86_64_run_id || inputs.run_id }}
        run: |
          set -euo pipefail
          for pair in "arm64:$ARM_RUN" "x86_64:$X86_RUN"; do
            cpu=${pair%%:*}; run=${pair#*:}
            status=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" --jq .status)
            if [ "$status" != completed ]; then
              echo "::error::The $cpu build (run $run) is still $status, so its disk image does not exist yet. Start this again once that run has finished: gh run view $run"
              exit 1
            fi
          done
          echo "Both builds have finished."
      - name: Check that both builds come from the same source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARM_RUN: ${{ inputs.run_id }}
          X86_RUN: ${{ inputs.x86_64_run_id || inputs.run_id }}
          CONFIRMED: ${{ inputs.same_source_confirmed }}
          COMPANIONS: ${{ inputs.companion_workflows }}
        run: |
          set -euo pipefail
          arm_sha=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ARM_RUN" --jq .head_sha)
          x86_sha=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$X86_RUN" --jq .head_sha)
          echo "arm64 from run $ARM_RUN at $arm_sha; x86_64 from run $X86_RUN at $x86_sha"
          if [ "$arm_sha" != "$x86_sha" ]; then
            # Different commits still count as one source when their only
            # difference is a reviewed companion workflow (named in
            # companion_workflows) that one side adds, as a separate Intel build
            # does. Any other difference, including .github/scripts,
            # .github/actions, other workflow files and any other file under
            # .github/workflows, makes them different sources. The companion's
            # own contents are printed below for review.
            git fetch --no-tags --depth=1 origin "$arm_sha" "$x86_sha"
            git cat-file -e "$arm_sha^{commit}" && git cat-file -e "$x86_sha^{commit}"
            git diff --name-status "$arm_sha" "$x86_sha" | tee differences.txt
            other=$(awk -F'\t' -v names=" $COMPANIONS " '
              !(($1 == "A" || $1 == "D") && $2 ~ /^\.github\/workflows\/[^\/]+\.ya?ml$/ &&
                index(names, " " substr($2, 19) " ") > 0)' differences.txt)
            if [ -z "$other" ]; then
              echo "Different commits, same source: the only difference is a reviewed companion workflow"
              while IFS=$'\t' read -r st path; do
                side=$x86_sha; [ "$st" = D ] && side=$arm_sha
                echo "----- $path (in ${side:0:7}) -----"; git show "$side:$path"
              done < differences.txt
            elif [ "$CONFIRMED" = true ]; then
              echo "::warning::The commits differ in build inputs; going on because same_source_confirmed was set"
              echo "$other" | head -20
            else
              echo "::error::The two builds come from different sources. Differences that affect the build:"
              echo "$other" | head -20
              exit 1
            fi
          fi
      - name: Fetch the arm64 disk image
        uses: actions/download-artifact@v4
        with:
          pattern: carriage_*_arm64-macos.dmg
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: dl
          merge-multiple: true
      - name: Fetch the x86_64 disk image
        uses: actions/download-artifact@v4
        with:
          pattern: carriage_*_x86_64-macos.dmg
          run-id: ${{ inputs.x86_64_run_id || inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: dl
          merge-multiple: true
      - name: Merge, sign and check
        id: merge
        env:
          TAKE_ARM64: ${{ inputs.take_arm64 }}
          HAS_CERTIFICATE: ${{ secrets.PROD_MACOS_CERTIFICATE != '' }}
        run: |
          set -euxo pipefail
          find dl -type f
          arm=$(find dl -name 'carriage_*_arm64-macos.dmg' | head -1)
          x86=$(find dl -name 'carriage_*_x86_64-macos.dmg' | head -1)
          if [ -z "$arm" ] || [ -z "$x86" ]; then
            echo "::error::Missing a disk image: arm64 '${arm}', x86_64 '${x86}'"; exit 1
          fi
          if [ "$(basename "${arm/_arm64-macos.dmg/}")" != "$(basename "${x86/_x86_64-macos.dmg/}")" ]; then
            echo "::error::The two disk images are different versions: $arm, $x86"; exit 1
          fi
          for pair in "arm64:$arm" "x86_64:$x86"; do
            cpu=${pair%%:*}; dmg=${pair#*:}
            mnt=$(mktemp -d); hdiutil attach -nobrowse -readonly -mountpoint "$mnt" "$dmg"
            mkdir -p "in/$cpu"; ditto "$mnt/Carriage.app" "in/$cpu/Carriage.app"; hdiutil detach "$mnt"
          done
          read -ra globs <<< "$TAKE_ARM64"
          extra=(); for g in ${globs[@]+"${globs[@]}"}; do extra+=(--take-arm64 "$g"); done
          python3 scripts/make_universal.py in/arm64/Carriage.app in/x86_64/Carriage.app \
            out/Carriage.app ${extra[@]+"${extra[@]}"}
          if [ "$HAS_CERTIFICATE" = true ]; then
            # The two builds are then Developer ID signed and notarised; an
            # ad-hoc universal app would quietly lose that (sign_adhoc.py
            # refuses Team ID inputs). Distribution signing of the merged app
            # is milestone C7.
            echo "::error::This workflow makes local development (ad-hoc) universal builds only; Developer ID signing of the merged app is not set up yet (C7)"
            exit 1
          fi
          # Inside out, keeping each helper's own entitlements and flags (not
          # codesign --deep, which drops them), then compared with both inputs.
          python3 scripts/sign_adhoc.py out/Carriage.app \
            --compare-with arm64=in/arm64/Carriage.app --compare-with x86_64=in/x86_64/Carriage.app
          codesign --verify --deep --strict --verbose=2 out/Carriage.app
          lipo -archs out/Carriage.app/Contents/MacOS/Carriage | tee archs.txt
          grep -q arm64 archs.txt && grep -q x86_64 archs.txt
          name=$(basename "$arm"); name=${name/_arm64-macos.dmg/_universal-macos.dmg}
          echo "file_name=$name" >> "$GITHUB_OUTPUT"
      - name: Open the new tab page natively and under Rosetta
        run: |
          set -eux
          app=out/Carriage.app/Contents/MacOS/Carriage
          flags=(--headless=new --no-first-run --use-mock-keychain --disable-crash-reporter
                 --enable-logging=stderr --v=0 --virtual-time-budget=5000 --window-size=1440,900)
          # A screenshot alone does not prove the page worked: also fail on
          # any uncaught error from the new tab page's scripts.
          check() {
            test -s "ntp-universal-$1.png"
            if grep -i "uncaught" "ntp-universal-$1.log" | grep -i "new-tab-page"; then
              echo "::error::The new tab page reported an error on $1"; exit 1
            fi
          }
          "$app" "${flags[@]}" --user-data-dir="$RUNNER_TEMP/p-arm64" \
            --screenshot="$PWD/ntp-universal-arm64.png" chrome://new-tab-page/ 2> ntp-universal-arm64.log
          check arm64
          if arch -x86_64 /usr/bin/true 2>/dev/null; then
            arch -x86_64 "$app" "${flags[@]}" --user-data-dir="$RUNNER_TEMP/p-x86_64" \
              --screenshot="$PWD/ntp-universal-x86_64.png" chrome://new-tab-page/ 2> ntp-universal-x86_64.log
            check x86_64
          else
            echo "::warning::No Rosetta on this runner: the Intel half was merged and signed but not opened"
          fi
      - name: Pack the disk image
        env:
          NAME: ${{ steps.merge.outputs.file_name }}
        run: |
          set -euxo pipefail
          # Same contents as sign_and_package_app.sh: the app, a link to
          # Applications, Carriage's background, window layout and volume icon.
          stage=$(mktemp -d)/Carriage
          mkdir -p "$stage/.background"
          ditto out/Carriage.app "$stage/Carriage.app"
          ln -s /Applications "$stage/Applications"
          cp resources/dmg_background.png "$stage/.background/dmg_background.png"
          cp resources/dmg_dsstore "$stage/.DS_Store"
          cp out/Carriage.app/Contents/Resources/app.icns "$stage/.VolumeIcon.icns"
          hdiutil create -volname Carriage -srcfolder "$stage" -format UDRW -ov rw.dmg
          mnt=$(mktemp -d); hdiutil attach -nobrowse -mountpoint "$mnt" rw.dmg
          SetFile -a C "$mnt" || echo "::warning::Volume icon not set"
          hdiutil detach "$mnt"
          mkdir -p release_asset
          hdiutil convert rw.dmg -format ULMO -o "release_asset/$NAME"
          f="release_asset/$NAME"
          printf 'Hashes for the disk image `%s`: \n' "$NAME" > "$NAME.hashes.md"
          printf '\n```\nmd5: %s\nsha1: %s\nsha256: %s\n```\n' "$(md5 -q "$f")" \
            "$(shasum -a 1 "$f" | cut -d' ' -f1)" "$(shasum -a 256 "$f" | cut -d' ' -f1)" \
            >> "$NAME.hashes.md"
          cat "$NAME.hashes.md"
      - name: Upload the universal disk image
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.merge.outputs.file_name }}
          path: |
            ./release_asset/${{ steps.merge.outputs.file_name }}
            ./${{ steps.merge.outputs.file_name }}.hashes.md
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ntp-universal-screenshots
          path: |
            ntp-universal-*.png
            ntp-universal-*.log
          if-no-files-found: warn
