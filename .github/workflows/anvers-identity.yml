name: Anvers identity — tests

on:
  push:
    paths:
      - 'anvers-identity/**'
      - '.github/workflows/anvers-identity.yml'
  pull_request:
    paths:
      - 'anvers-identity/**'
      - '.github/workflows/anvers-identity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: anvers-identity
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unit tests
        run: node --test test/unit.test.js
      - name: Browser tests
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
          node --test test/browser.test.mjs
