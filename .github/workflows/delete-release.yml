name: Delete a release and its tag
on:
  workflow_dispatch:
    inputs:
      tags: {description: Space-separated release tags, required: true}
permissions: {contents: write}
jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - env: {GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}'}
        run: for t in ${{ inputs.tags }}; do gh release delete "$t" --repo "${{ github.repository }}" -y --cleanup-tag; done
