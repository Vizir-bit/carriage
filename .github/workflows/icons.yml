name: Carriage — compile app icon

on: workflow_dispatch

permissions:
  contents: read

jobs:
  icon:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile Assets.car and app.icns
        run: |
          set -euxo pipefail
          xcodebuild -version
          src=resources/carriage-icon
          work=$(mktemp -d)
          cp -R "$src/AppIcon.icon" "$work/AppIcon.icon"
          mkdir -p "$work/Assets.xcassets/AppIcon.appiconset"
          cp resources/assets/Assets.xcassets/Contents.json "$work/Assets.xcassets/"
          cp resources/assets/Assets.xcassets/AppIcon.appiconset/Contents.json "$work/Assets.xcassets/AppIcon.appiconset/"
          for s in 16 32 64 128 256 512; do
            in=resources/assets/legacy.png
            if [ $s -le 32 ]; then in=resources/assets/legacy_crop.png; fi
            sips -z $s $s "$in" --out "$work/Assets.xcassets/AppIcon.appiconset/appicon_${s}.png"
          done
          mkdir -p out
          xcrun actool "$work/AppIcon.icon" "$work/Assets.xcassets" --compile out \
            --platform macosx --minimum-deployment-target 12.0 \
            --app-icon AppIcon --include-all-app-icons \
            --output-partial-info-plist out/partial.plist \
            --errors --warnings --notices
          ls -la out
          if [ -f out/AppIcon.icns ]; then cp out/AppIcon.icns out/app.icns; fi
      - uses: actions/upload-artifact@v4
        with:
          name: carriage-icon
          path: out/
