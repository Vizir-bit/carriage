<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; form-action 'none'; base-uri 'none'; require-trusted-types-for 'script'">
<meta name="color-scheme" content="light dark">
<title>Anvers</title>
<link rel="stylesheet" href="../anvers-identity.css">
<link rel="stylesheet" href="demo.css">
<script src="../anvers-identity.js" defer></script>
<script src="demo.js" defer></script>
</head>
<body>
<main class="home">
  <h1 class="home__identity">
    <span class="anvers-identity" data-anvers-identity data-seed="random" data-wordmark="true" data-motion="settle"><!-- static default: AnversIdentity.svg('anvers', {label: ''}) -->
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" class="anvers-mark" focusable="false" aria-hidden="true" data-anvers-seed="anvers" data-anvers-grammar="1"><path class="anvers-mark__shape anvers-mark__shape--yellow" fill="#e0a817" d="M 18.11 27.67 L 77.04 31.41 L 83.31 71.85 L 19.13 68.86 Z"/></svg>
      <span class="anvers-identity__wordmark">anvers</span>
    </span>
  </h1>

  <form class="home__search" role="search" action="" method="get">
    <label class="visually-hidden" for="q">Search</label>
    <input id="q" name="q" type="search" autocomplete="off" spellcheck="false" placeholder="Search" enterkeyhint="search">
    <button type="submit">Search</button>
  </form>

  <nav class="home__links" aria-label="Links">
    <ul>
      <li><a href="https://plato.stanford.edu/">Stanford Encyclopedia</a></li>
      <li><a href="https://www.gutenberg.org/">Project Gutenberg</a></li>
      <li><a href="https://archive.org/">Internet Archive</a></li>
      <li><a href="https://gallica.bnf.fr/">Gallica</a></li>
      <li><a href="https://en.wikipedia.org/">Wikipedia</a></li>
    </ul>
  </nav>

  <p class="home__seed">
    <span>Seed <output id="seed" for="reroll">anvers</output></span>
    <button type="button" id="reroll">Another</button>
  </p>
  <p class="home__status" id="status" role="status"></p>
</main>
</body>
</html>
